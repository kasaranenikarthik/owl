global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9090"]

  - job_name: inference
    static_configs:
      - targets: ["inference:9090"]

  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]

  - job_name: kafka_exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
