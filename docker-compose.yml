name: owl

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: owl-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - owl

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: owl-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    networks:
      - owl

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: owl-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-lc"]
    command: |
      for i in {1..30}; do
        kafka-topics --bootstrap-server kafka:9092 --list && break
        sleep 2
      done
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic frames --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic detections --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --list
    networks:
      - owl

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: owl-kafka-exporter
    depends_on:
      - kafka
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "9308:9308"
    networks:
      - owl

  redis:
    image: redis:7-alpine
    container_name: owl-redis
    ports:
      - "6379:6379"
    networks:
      - owl

  model-loader:
    image: alpine:3.20
    container_name: owl-model-loader
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        apk add --no-cache wget
        mkdir -p /models/yolov8s/1
        cp /repo/server/internal/models/yolov8s/config.pbtxt /models/yolov8s/config.pbtxt
        wget -q -O /models/yolov8s/1/model.onnx https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8s.onnx
        ls -R /models/yolov8s
    volumes:
      - model_repo:/models
      - ./:/repo:ro
    networks:
      - owl

  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: owl-triton
    depends_on:
      model-loader:
        condition: service_completed_successfully
    command:
      - tritonserver
      - --model-repository=/models
      - --strict-model-config=true
      - --allow-metrics=true
      - --allow-gpu-metrics=true
      - --metrics-port=8002
    volumes:
      - model_repo:/models:ro
    ports:
      - "8000:8000"
      - "8001:8001"
      - "18002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - owl

  gateway:
    build:
      context: ./server
      dockerfile: ./cmd/gateway/Dockerfile.gateway
    container_name: owl-gateway
    depends_on:
      - kafka
      - redis
      - kafka-init
    environment:
      HTTP_PORT: "8080"
      METRICS_PORT: "9090"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_FRAMES_TOPIC: "frames"
      KAFKA_DETECTIONS_TOPIC: "detections"
      KAFKA_CONSUMER_GROUP: "gateway-detections"
      REDIS_ADDR: "redis:6379"
      SIMILARITY_THRESHOLD: "5"
      CACHE_TTL_SECONDS: "30"
      CONFIDENCE_THRESHOLD: "0.5"
    ports:
      - "8080:8080"
      - "19090:9090"
    networks:
      - owl

  inference:
    build:
      context: ./server
      dockerfile: ./cmd/inference/Dockerfile.inference
    container_name: owl-inference
    depends_on:
      - kafka
      - triton
      - kafka-init
    environment:
      METRICS_PORT: "9090"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_FRAMES_TOPIC: "frames"
      KAFKA_DETECTIONS_TOPIC: "detections"
      KAFKA_CONSUMER_GROUP: "yolo-inference"
      TRITON_HTTP_ADDR: "triton:8000"
      NUM_WORKERS: "8"
      CONFIDENCE_THRESHOLD: "0.5"
    ports:
      - "19091:9090"
    networks:
      - owl

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: owl-prometheus
    depends_on:
      - gateway
      - inference
      - triton
      - kafka-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - owl

  grafana:
    image: grafana/grafana:11.1.0
    container_name: owl-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - owl

  yolo-client:
    build:
      context: ./yolo_client
      dockerfile: Dockerfile
    container_name: owl-yolo-client
    depends_on:
      - gateway
    profiles:
      - client
    command: ["python", "cli.py", "--help"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/data
    networks:
      - owl

networks:
  owl:
    driver: bridge

volumes:
  model_repo:
  prometheus_data:
  grafana_data:
