name: owl

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: owl-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - owl

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: owl-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    networks:
      - owl

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: owl-kafka-init
    depends_on:
      - kafka
    entrypoint: /bin/bash
    command:
      - -c
      - |
        for i in {1..30}; do
          kafka-topics --bootstrap-server kafka:9092 --list && break
          sleep 2
        done
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic frames --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic detections --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --list
    networks:
      - owl

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: owl-kafka-exporter
    restart: unless-stopped
    depends_on:
      - kafka
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "9308:9308"
    networks:
      - owl

  redis:
    image: redis:7-alpine
    container_name: owl-redis
    ports:
      - "6379:6379"
    networks:
      - owl

  model-loader:
    image: python:3.11-slim
    container_name: owl-model-loader
    environment:
      TRITON_EXECUTION_TARGET: "${TRITON_EXECUTION_TARGET:-gpu}"
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        ONNX_PATH=/repo/server/internal/onnx/yolov8s.onnx
        CPU_CONFIG_PATH=/repo/server/internal/models/yolov8s/config.pbtxt
        GPU_CONFIG_PATH=/repo/server/internal/models/yolov8s/config.gpu.pbtxt
        MODEL_CONFIG_PATH="$$CPU_CONFIG_PATH"
        EXPORT_FLAGS="--dynamic-batch --half"
        case "$${TRITON_EXECUTION_TARGET}" in
          gpu)
            if [ -f "$$GPU_CONFIG_PATH" ]; then
              MODEL_CONFIG_PATH="$$GPU_CONFIG_PATH"
              echo "Using explicit GPU config: $$MODEL_CONFIG_PATH"
            else
              echo "TRITON_EXECUTION_TARGET=gpu but $$GPU_CONFIG_PATH is missing"
              exit 1
            fi
            ;;
          cpu)
            echo "Using explicit CPU config: $$MODEL_CONFIG_PATH"
            ;;
          *)
            echo "Unsupported TRITON_EXECUTION_TARGET=$${TRITON_EXECUTION_TARGET}; use cpu or gpu"
            exit 1
            ;;
        esac
        rm -rf /models/*
        mkdir -p /models/yolov8s/1
        cp "$$MODEL_CONFIG_PATH" /models/yolov8s/config.pbtxt
        if [ -f "$$ONNX_PATH" ]; then
          echo "Found existing ONNX at $$ONNX_PATH"
        else
          echo "ONNX not found at $$ONNX_PATH. Exporting a new model..."
          apt-get update && apt-get install -y --no-install-recommends wget ca-certificates libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libx11-6 libxcb1 && rm -rf /var/lib/apt/lists/*
          python -m pip install --no-cache-dir "torch<2.6" "torchvision<0.21" ultralytics==8.1.0 onnx onnxruntime onnxconverter-common
          echo "Downloading YOLOv8s weights from ultralytics/assets v8.1.0..."
          wget -O /tmp/yolov8s.pt https://github.com/ultralytics/assets/releases/download/v8.1.0/yolov8s.pt
          echo "Exporting ONNX model to $$ONNX_PATH..."
          python /repo/server/internal/onnx/export_yolo_onnx.py --weights /tmp/yolov8s.pt --output "$$ONNX_PATH" --imgsz 640 --opset 12 $$EXPORT_FLAGS
        fi
        cp "$$ONNX_PATH" /models/yolov8s/1/model.onnx
        ls -lh /models/yolov8s/1/
    volumes:
      - model_repo:/models
      - ./:/repo
    networks:
      - owl

  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: owl-triton
    depends_on:
      model-loader:
        condition: service_completed_successfully
    command:
      - tritonserver
      - --model-repository=/models
      - --strict-model-config=false
      - --allow-metrics=true
      - --allow-gpu-metrics=true
      - --metrics-port=8002
    gpus: all
    volumes:
      - model_repo:/models:ro
    ports:
      - "8000:8000"
      - "8001:8001"
      - "18002:8002"
    networks:
      - owl

  gateway:
    build:
      context: ./server
      dockerfile: ./cmd/gateway/Dockerfile.gateway
    container_name: owl-gateway
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
      - kafka-init
    environment:
      HTTP_PORT: "8080"
      METRICS_PORT: "9090"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_FRAMES_TOPIC: "frames"
      KAFKA_DETECTIONS_TOPIC: "detections"
      KAFKA_CONSUMER_GROUP: "gateway-detections"
      REDIS_ADDR: "redis:6379"
      SIMILARITY_THRESHOLD: "-1"
      CACHE_TTL_SECONDS: "30"
      CONFIDENCE_THRESHOLD: "0.5"
    ports:
      - "8080:8080"
      - "19090:9090"
    networks:
      - owl

  inference:
    build:
      context: ./server
      dockerfile: ./cmd/inference/Dockerfile.inference
    container_name: owl-inference
    restart: unless-stopped
    depends_on:
      - kafka
      - triton
      - kafka-init
    environment:
      METRICS_PORT: "9090"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_FRAMES_TOPIC: "frames"
      KAFKA_DETECTIONS_TOPIC: "detections"
      KAFKA_CONSUMER_GROUP: "yolo-inference"
      TRITON_HTTP_ADDR: "triton:8000"
      NUM_WORKERS: "32"
      CONFIDENCE_THRESHOLD: "0.5"
    ports:
      - "19091:9090"
    networks:
      - owl

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: owl-prometheus
    depends_on:
      - gateway
      - inference
      - triton
      - kafka-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - owl

  grafana:
    image: grafana/grafana:11.1.0
    container_name: owl-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - owl

networks:
  owl:
    driver: bridge

volumes:
  model_repo:
  prometheus_data:
  grafana_data:
